<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APAR - Developer Mode Authorization</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070b14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: #1e293b;
            --border-accent: rgba(245, 158, 11, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --amber-glow: #f59e0b;
            --amber-hover: #fbbf24;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08), transparent 450px),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.06), transparent 450px),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        .dev-login-container {
            width: 100%;
            max-width: 460px;
            padding: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .dev-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--amber-glow);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--amber-glow);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--amber-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--amber-glow), transparent);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo-img {
            max-width: 170px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }

        .form-label {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-control:focus {
            border-color: var(--amber-glow) !important;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18) !important;
            outline: none;
        }

        .btn-dev-login {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: #0b0f19;
            font-weight: 700;
            padding: 0.85rem 2rem;
            border-radius: 10px;
            width: 100%;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
        }

        .btn-dev-login:hover {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000000;
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.4);
            transform: translateY(-1px);
        }

        .btn-dev-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
            border: none;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.82rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a:hover {
            color: var(--amber-glow);
        }
    </style>
</head>
<body>
    <div class="dev-login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="{{ url_for('static', filename='apar_logo_dark.png') }}" alt="APAR Industries Logo" class="brand-logo-img">
                <div>
                    <div class="dev-badge-header">
                        <span class="pulse-dot"></span> Developer Mode
                    </div>
                </div>
                <div class="text-muted small" style="letter-spacing: 0.5px;">Restricted Administrative Control Center</div>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/developer/login">
                <div class="mb-3">
                    <label for="username" class="form-label">Developer Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="admin" required autofocus autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Admin Security Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-dev-login">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.464 9.99a11.8 11.8 0 0 0 2.946 2.659c.638.411 1.272.71 1.449.774a1.7 1.7 0 0 0 1.96 0c.177-.064.811-.363 1.449-.774a11.8 11.8 0 0 0 2.946-2.659c1.677-2.195 3.06-5.513 2.464-9.99a1.54 1.54 0 0 0-1.044-1.263 63 63 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5"/>
                    </svg>
                    Authorize Access
                </button>
            </form>

            <div class="nav-links">
                <a href="/login">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                    </svg>
                    User Login
                </a>
                <a href="/?login=true">
                    Operations Portal
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5"/>
                        <path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
    <script>
        const devForm = document.querySelector('form');
        if (devForm) {
            devForm.addEventListener('submit', () => {
                sessionStorage.setItem('tab_authenticated', 'true');
            });
        }
    </script>
</body>
</html>
