<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APAR - Oil Sample Monitoring System Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --card-bg: #121824;
            --border-color: #232d42;
            --text-main: #fafafa;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --input-bg: #1e293b;
            --input-focus-border: #475569;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 400px),
                              radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent 400px);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 1.25rem;
            display: inline-block;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15) !important;
            outline: none;
        }

        .btn-login {
            background-color: var(--accent);
            border: 1px solid var(--accent);
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
            border: none;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
        }
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="{{ url_for('static', filename='apar_logo_dark.png') }}" alt="APAR Industries Logo" class="brand-logo-img">
                <div class="brand-subtitle">Oil Sample Monitoring System</div>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="mb-4">
                    <label for="password" class="form-label">ENTER ACCESS PASSWORD</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autofocus>
                </div>
                <button type="submit" class="btn btn-login text-uppercase">Authorize Access</button>
            </form>
        </div>
    </div>
</body>
</html>
