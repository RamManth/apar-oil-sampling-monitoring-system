<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APAR - Recover Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --card-bg: #121824;
            --border-color: #232d42;
            --text-main: #fafafa;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --input-bg: #1e293b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 400px),
                              radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent 400px);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 1.25rem;
            display: inline-block;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15) !important;
            outline: none;
        }

        .form-control.select-dropdown {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 14px;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .form-control.select-dropdown option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .btn-login {
            background-color: var(--accent);
            border: 1px solid var(--accent);
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .forgot-password-link {
            font-size: 0.75rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-top: 1.5rem;
        }

        .forgot-password-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
            border: none;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
        }
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="{{ url_for('static', filename='apar_logo_dark.png') }}" alt="APAR Industries Logo" class="brand-logo-img">
                <div class="brand-subtitle">Password Recovery</div>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- JS Notification Container -->
            <div id="notificationContainer"></div>

            <form id="forgotForm" method="POST" action="/forgot_password">
                <div class="mb-4">
                    <label for="username" class="form-label">SELECT USER PROFILE</label>
                    <select class="form-control select-dropdown" id="username" name="username" required autofocus>
                        <option value="" disabled selected>Choose a user...</option>
                        {% for user in users %}
                            <option value="{{ user.username }}">{{ user.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-login text-uppercase">Send Recovery Link</button>
            </form>

            <div class="text-center">
                <a href="/login" class="forgot-password-link text-uppercase font-weight-bold">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const forgotForm = document.getElementById('forgotForm');
            const usernameSelect = document.getElementById('username');
            const submitBtn = document.querySelector('.btn-login');
            const alertContainer = document.getElementById('notificationContainer');

            const showNotification = (type, message) => {
                if (alertContainer) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-${type} fade show" role="alert" style="animation: slideIn 0.3s ease;">
                            ${message}
                        </div>
                    `;
                }
            };

            if (forgotForm) {
                forgotForm.addEventListener('submit', async function(e) {
                    // Stop default submission for a smooth AJAX recovery flow
                    e.preventDefault();
                    
                    if (!usernameSelect.value) {
                        showNotification("danger", "Please select a user profile first.");
                        return;
                    }
                    
                    const originalText = submitBtn.innerText;
                    submitBtn.innerText = "SENDING RECOVERY LINK...";
                    submitBtn.disabled = true;
                    usernameSelect.disabled = true;
                    
                    try {
                        const response = await fetch('/forgot_password', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ username: usernameSelect.value })
                        });
                        
                        const result = await response.json();
                        if (response.ok && result.success) {
                            showNotification("success", result.message || "Recovery email sent successfully!");
                            // Clear option selection
                            usernameSelect.value = "";
                        } else {
                            showNotification("danger", result.error || "Failed to dispatch recovery link.");
                        }
                    } catch (err) {
                        showNotification("danger", "A connection error occurred. Please try again.");
                    } finally {
                        submitBtn.innerText = originalText;
                        submitBtn.disabled = false;
                        usernameSelect.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
