version: '3.8'

services:
  web:
    build: .
    container_name: apar-monitoring-system
    ports:
      - "5001:5001"
    # Env variables can be loaded from a local .env file or host environment
    environment:
      - GOOGLE_SERVICE_ACCOUNT_JSON
    # OPTIONAL: Mount credentials.json locally into the container for easy local testing.
    # Uncomment the lines below ONLY if you have a local credentials.json file.
    # Otherwise, it will fail to start if the file is missing (use GOOGLE_SERVICE_ACCOUNT_JSON instead).
    # volumes:
    #   - type: bind
    #     source: ./credentials.json
    #     target: /app/credentials.json
    #     read_only: true

